<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sebastien YE — Curriculum Vitae (Version Web &amp; Imprimable)</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0f172a;
      --muted: #475569;
      --accent: #0284c7;
      --border: #e2e8f0;
      --bg: #f8fafc;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      padding: 40px 20px;
    }
    .toolbar {
      max-width: 880px;
      margin: 0 auto 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      text-decoration: none;
      cursor: pointer;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--ink);
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    .sheet {
      max-width: 880px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 44px;
      box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.07);
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      padding-bottom: 24px;
      border-bottom: 2px solid var(--ink);
      margin-bottom: 24px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .avatar {
      width: 84px;
      height: 84px;
      border-radius: 16px;
      object-fit: cover;
      object-position: center 18%;
      border: 2px solid var(--accent);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.1rem;
      letter-spacing: -0.02em;
    }
    .role {
      color: var(--accent);
      font-weight: 600;
      font-size: 1.02rem;
      margin-top: 2px;
    }
    .contact-list {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: right;
      line-height: 1.65;
    }
    .section { margin-bottom: 22px; }
    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--accent);
      border-bottom: 1px solid var(--border);
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .item { margin-bottom: 14px; }
    .item-head {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.96rem;
    }
    .item-sub {
      color: var(--muted);
      font-size: 0.86rem;
      margin-bottom: 4px;
    }
    ul { padding-left: 18px; color: var(--muted); font-size: 0.88rem; }
    li { margin-bottom: 3px; }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      font-size: 0.88rem;
    }
    @media print {
      body { background: #fff; padding: 0; }
      .toolbar { display: none; }
      .sheet { box-shadow: none; border: none; padding: 0; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="../index.html" class="btn">← Retour au Portfolio</a>
    <div style="display:flex;gap:10px;">
      <a href="CV-Sebastien-YE.pdf" download class="btn">Télécharger le PDF Original</a>
      <button type="button" class="btn btn-primary" onclick="window.print()">Imprimer / Enregistrer en PDF</button>
    </div>
  </div>

  <article class="sheet" id="resume-sheet"></article>

  <script src="../js/portfolio-data.js"></script>
  <script>
    (function () {
      const d = window.PORTFOLIO_DATA;
      if (!d) return;
      const sheet = document.getElementById("resume-sheet");
      sheet.innerHTML = `
        <header>
          <div class="header-left">
            <img src="profile-sebastien-ye.jpg" alt="${d.profile.name}" class="avatar" />
            <div>
              <h1>${d.profile.name}</h1>
              <div class="role">Ingénieur ML avec 5 ans d'expérience</div>
              <div style="font-size:0.84rem;color:var(--muted);margin-top:4px;">${d.profile.availability}</div>
            </div>
          </div>
          <div class="contact-list">
            <div>${d.profile.address}</div>
            <div>${d.profile.phone}</div>
            <div>${d.profile.email}</div>
            <div>github.com/${d.profile.handle} · ${d.profile.drivingLicense}</div>
          </div>
        </header>

        <section class="section">
          <h2 class="section-title">Profil</h2>
          <p style="color:var(--muted);font-size:0.92rem;">${d.profile.tagline}</p>
        </section>

        <section class="section">
          <h2 class="section-title">Expériences Professionnelles &amp; Formation</h2>
          ${d.experience.map(e => `
            <div class="item">
              <div class="item-head">
                <span>${e.role} — ${e.company}</span>
                <span style="font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--muted);">${e.period}</span>
              </div>
              <div class="item-sub">${e.location} · ${e.summary}</div>
              <ul>
                ${e.achievements.map(a => `<li>${a}</li>`).join("")}
              </ul>
            </div>
          `).join("")}
        </section>

        <section class="section">
          <h2 class="section-title">Compétences Techniques (Hard Skills) &amp; Soft Skills</h2>
          <div class="grid-2">
            ${d.skills.map(s => `
              <div>
                <strong>${s.category} :</strong>
                <span style="color:var(--muted);">${s.items.map(i => i.name).join(", ")}</span>
              </div>
            `).join("")}
          </div>
          <div style="margin-top:10px;font-size:0.88rem;">
            <strong>Soft Skills :</strong> <span style="color:var(--muted);">${d.profile.softSkills.join(" · ")}</span>
          </div>
        </section>

        <section class="section" style="margin-bottom:0;">
          <h2 class="section-title">Certifications, Langues, Bénévolat &amp; Loisirs</h2>
          <div class="grid-2">
            <div>
              <strong>Certifications :</strong>
              <ul>
                ${d.profile.certifications.map(c => `<li>${c.title} (${c.issuer})</li>`).join("")}
              </ul>
              <div style="margin-top:8px;">
                <strong>Bénévolat :</strong>
                <ul>
                  ${d.profile.volunteering.map(v => `<li><strong>${v.org} :</strong> ${v.detail}</li>`).join("")}
                </ul>
              </div>
            </div>
            <div>
              <strong>Langues :</strong>
              <ul>
                ${d.profile.languages.map(l => `<li><strong>${l.name} :</strong> ${l.level}</li>`).join("")}
              </ul>
              <div style="margin-top:8px;">
                <strong>Loisirs :</strong>
                <span style="color:var(--muted);">${d.profile.interests.join(", ")}</span>
              </div>
            </div>
          </div>
        </section>
      `;
    })();
  </script>
</body>
</html>
